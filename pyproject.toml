[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-retrieval-engine"
version = "2.0.0"
description = "A teaching-oriented DNA tolerant retrieval engine"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pywebview==6.2.1",
  "pythonnet==3.1.0",
]

[project.scripts]
dna-retrieval = "dna_retrieval_engine.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
